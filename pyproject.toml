[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "SentinelSOC"
version = "1.0.0"
authors = [
  { name="Colly-dev" },
]
description = "Open-Source Security Operations Center Platform for Blue Team Training and Detection Engineering"
readme = "README.md"
requires-python = ">=3.12"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Topic :: Security",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "loguru>=0.7.0",
    "pyyaml>=6.0",
    "jinja2>=3.1.0",
    "colorama>=0.4.6",
    "python-dotenv>=1.0.0",
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "requests>=2.31.0",
    "docker>=6.1.0",
    "pyelasticsearch>=1.0.0",
    "splunk-sdk>=1.7.0",
    "sigma>=0.10.0",
    "pydantic>=2.0.0",
    "click>=8.1.0",
    "rich>=13.5.0",
    "aiofiles>=23.0.0",
    "asyncio>=3.4.3",
]

[project.urls]
"Homepage" = "https://github.com/Colly-dev/SentinelSOC"
"Bug Tracker" = "https://github.com/Colly-dev/SentinelSOC/issues"

[project.scripts]
sentinelsoc = "main:main"
