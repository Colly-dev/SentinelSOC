name: SentinelSOC Deploy

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
    - name: Build Docker images
      run: |
        docker-compose -f docker/docker-compose.yml build
    - name: Log in to Registry
      run: echo "Logging in to registry..."
